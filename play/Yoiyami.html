<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>よいやみ（中間発表版）</title>
<style>
/* よいやみ 中間発表版。企画書（2026-11-09 ときとまる）とデザイナーの絵（2026-11-13 さりー）をもとにした仮素材版。
   色は 11/12 ときとまるさん「背景の彩度上げりゃ黒も映えてよくない？」に合わせて、彩度の高い青の夜にしている。 */
:root { --ink: #f3f1ff; --dim: #a9b2ff; --red: #ff8f8a; --paper: #f4efe6; --black: #17171b; font-family: "Yu Gothic UI", "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif; color: var(--ink); background: #0a0f6e; }
* { box-sizing: border-box; }
body { margin: 0; height: 100dvh; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
[hidden] { display: none !important; }
#game { position: relative; width: 100vw; height: 100dvh; overflow: hidden; touch-action: manipulation; }
.screen { position: absolute; inset: 0; overflow: hidden; }
.fade { animation: fade 0.7s ease-out; }
@keyframes fade { from { opacity: 0; } }
.sky { background: linear-gradient(#0a0f6e 0%, #1826c0 55%, #3549ea 100%); }

/* 1280×720 で描いた場面を、画面の高さに合わせて拡大縮小する */
.stage { position: absolute; left: 50%; bottom: 0; width: 1280px; height: 720px; margin-left: -640px; transform-origin: 50% 100%; transform: scale(var(--s)); }
.stage svg.bg { position: absolute; inset: 0; }
.sprite { position: absolute; width: 150px; height: 150px; margin-left: -75px; pointer-events: none; image-rendering: auto; }

/* ベンチ */
#bench.dawn { background: linear-gradient(#35409f 0%, #b98bc4 55%, #ffc9a8 100%); transition: background 2.5s; }
#bench .lampglow .lit { transition: opacity 2.5s; }
#bench.dawn .lampglow .lit { opacity: 0; }
#benchYoi { bottom: 196px; left: 1500px; transition: left 1.6s cubic-bezier(.2,.7,.3,1); }
#log { position: absolute; left: 50%; bottom: calc(430px * var(--s)); width: min(540px, 92vw); transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.msg { max-width: 84%; padding: 9px 15px; border-radius: 16px; font-size: clamp(14px, 2.2vmin + 6px, 17px); line-height: 1.6; animation: up 0.35s ease-out; transition: opacity 0.5s; box-shadow: 0 2px 0 #0a0f6e55; }
.msg.girl { align-self: flex-start; background: var(--paper); color: #1d1b33; border-bottom-left-radius: 3px; }
.msg.yoi { align-self: flex-end; background: var(--black); border-bottom-right-radius: 3px; }
.msg.note { align-self: center; max-width: 100%; background: #0a0f6ecc; border-radius: 4px; color: #ffe9a8; font-size: 14px; text-align: center; }
.msg.old { opacity: 0.4; }
.msg.older { opacity: 0.15; }
@keyframes up { from { opacity: 0; transform: translateY(12px); } }
#choices { position: absolute; left: 50%; bottom: calc(60px * var(--s) + 26px); transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 12px; width: min(680px, 94vw); }
.choice { background: var(--black); border: 0; border-radius: 16px 16px 3px 16px; color: var(--red); padding: 10px 18px; font-size: clamp(14px, 2.2vmin + 6px, 17px); box-shadow: 0 2px 0 #0a0f6e88; }
.choice:hover { background: #2a2a31; }
#tap { position: absolute; left: 0; right: 0; bottom: 10px; margin: 0; text-align: center; font-size: 12px; color: var(--dim); pointer-events: none; }

/* タイトル（ベンチの場面の上に出す） */
#titleUI { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr; align-content: center; justify-items: start; padding-left: clamp(24px, 9vw, 130px); background: linear-gradient(90deg, #0a0f6ef2 0%, #0a0f6ed9 30%, #0a0f6e55 48%, transparent 64%); }
#titleUI h1 { margin: 0; font-size: clamp(54px, 13vmin, 112px); font-weight: 700; letter-spacing: 0.08em; line-height: 1.05; }
#titleUI h1 span { display: block; font-size: 0.16em; font-weight: 400; letter-spacing: 0.5em; color: var(--dim); margin: 0 0 0.6em 0.3em; }
#titleUI .lead { margin: 14px 0 26px 4px; font-size: clamp(13px, 2.2vmin, 16px); line-height: 1.9; color: #dfe3ff; }
#titleUI nav { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.menu { background: none; border: 0; padding: 7px 4px; font-size: clamp(16px, 3vmin, 20px); }
.menu::before { content: '　'; }
.menu:hover::before, .menu:focus-visible::before { content: '▸'; color: var(--red); }
#titleUI small { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 11px; color: #c5cbff; padding: 0 12px; }

/* 探索マップ */
#world, #far { position: absolute; left: 0; bottom: 0; height: 720px; transform-origin: 0 100%; will-change: transform; }
#far svg, #world svg.bg { position: absolute; left: 0; top: 0; }
.obj { position: absolute; bottom: 202px; transform: translateX(-50%); }
.obj svg { display: block; overflow: visible; }
.obj.done { opacity: 0.45; }
.scrap { position: absolute; left: 50%; top: -46px; width: 22px; height: 26px; margin-left: -11px; background: var(--paper); clip-path: polygon(0 8%, 60% 0, 100% 22%, 92% 100%, 18% 92%); animation: scrap 1.6s ease-in-out infinite; }
.obj.done .scrap, .obj.noscrap .scrap { display: none; }
.obj.near .scrap { background: #ffe38a; }
@keyframes scrap { 50% { transform: translateY(-7px) rotate(8deg); } }
.exit { position: absolute; bottom: 202px; transform: translateX(-50%); }
#player { bottom: 198px; z-index: 5; }
.shadow-kid { position: absolute; bottom: 200px; width: 70px; height: 190px; margin-left: -35px; opacity: 0.6; filter: blur(3px); animation: sway 3.4s ease-in-out infinite; }
@keyframes sway { 50% { transform: translateX(16px) skewX(5deg) scaleY(1.03); opacity: 0.35; } }
#map.uneasy #world { animation: uneasy 0.22s steps(2) infinite; }
@keyframes uneasy { 50% { filter: hue-rotate(-18deg) brightness(0.9); margin-bottom: 2px; } }
[data-id="C02"] .lit { animation: flick 2.3s steps(1) infinite; }
.netflat, .obj.fixed .netopen { display: none; }
.obj.fixed .netflat { display: inline; }
@keyframes flick { 0%, 100% { opacity: 1; } 8% { opacity: 0.15; } 12% { opacity: 1; } 46% { opacity: 0.2; } 50% { opacity: 0.9; } 54% { opacity: 0.1; } 60% { opacity: 1; } }
.glint { animation: glint 1.4s ease-in-out infinite; }
@keyframes glint { 50% { opacity: 0.25; } }
.swing { transform-origin: 85px 14px; animation: swing 2.2s ease-in-out infinite alternate; }
@keyframes swing { from { transform: rotate(-13deg); } to { transform: rotate(13deg); } }
.drip { animation: drip 0.5s linear infinite; }
@keyframes drip { to { stroke-dashoffset: -16; } }
.roll { animation: roll 1.9s cubic-bezier(.2,.6,.3,1) forwards; }
@keyframes roll { from { transform: translateX(760px) rotate(2160deg); } to { transform: translateX(0) rotate(0); } }
.kicked { animation: kicked 0.8s cubic-bezier(.2,.6,.6,1) forwards; }
@keyframes kicked { to { transform: translate(520px, -260px) rotate(900deg); opacity: 0; } }

#hud { position: absolute; top: 12px; left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; }
#place { font-size: clamp(16px, 3vmin, 22px); font-weight: 700; text-shadow: 0 2px 0 #0a0f6e; }
#place small { display: block; font-size: 12px; font-weight: 400; color: var(--dim); }
#bag { pointer-events: auto; background: none; border: 0; padding: 0; text-align: right; }
#bag .count { font-size: 13px; color: #dfe3ff; text-shadow: 0 1px 0 #0a0f6e; }
#pieces { display: flex; gap: 4px; justify-content: flex-end; margin-top: 6px; }
#pieces span { width: 15px; height: 19px; background: #ffffff22; clip-path: polygon(0 8%, 60% 0, 100% 22%, 92% 100%, 18% 92%); }
#pieces .a-day { background: #ffc37a; } #pieces .a-night { background: #9db4ff; } #pieces .a-lamp { background: #f4efe6; } #pieces .a-special { background: #ff8f8a; }
#bagList { position: absolute; top: 62px; right: 14px; margin: 0; padding: 10px 14px; list-style: none; background: #0a0f6eee; border-radius: 4px; font-size: 14px; line-height: 1.9; text-align: right; }
@media (max-width: 640px) { #hud { top: 46px; } #bagList { top: 96px !important; } }
#hint { position: absolute; left: 50%; bottom: calc(96px * var(--s) + 8px); transform: translateX(-50%); margin: 0; padding: 6px 14px; border-radius: 16px; background: #0a0f6ecc; font-size: clamp(13px, 2.4vmin, 16px); white-space: nowrap; pointer-events: none; }
#hint b { color: #ffe38a; font-weight: 700; }
#hint kbd { font: inherit; font-size: 0.85em; border: 1px solid #ffffff66; border-radius: 3px; padding: 0 5px; margin-left: 8px; }
#ask { position: absolute; left: 50%; top: max(52px, 14%); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px; width: min(600px, 94vw); }
#ask p { margin: 0 0 2px; padding: 9px 16px; background: var(--paper); color: #1d1b33; border-radius: 16px; font-size: clamp(14px, 2.2vmin + 6px, 17px); line-height: 1.6; text-align: center; }
#ask .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
#ask .bar { position: relative; width: min(300px, 80vw); height: 16px; background: #0a0f6e; border-radius: 8px; }
#ask .zone { position: absolute; left: 40%; width: 20%; height: 100%; background: #ffe38a88; border-radius: 4px; }
#ask .ball { position: absolute; top: -4px; width: 24px; height: 24px; margin-left: -12px; border-radius: 50%; background: #fff; box-shadow: inset -4px -4px 0 #c9cbe0; }
#ask .num { background: none; color: var(--ink); padding: 0; font-weight: 700; }
.touch { position: absolute; bottom: calc(14px + env(safe-area-inset-bottom)); width: 64px; height: 64px; border-radius: 50%; border: 2px solid #ffffff66; background: #0a0f6e99; font-size: 22px; touch-action: none; }
.touch.l { left: calc(14px + env(safe-area-inset-left)); } .touch.r { left: calc(90px + env(safe-area-inset-left)); }
.touch.act { left: auto; right: calc(14px + env(safe-area-inset-right)); width: auto; padding: 0 22px; border-radius: 32px; font-size: 16px; background: var(--black); border-color: var(--red); color: var(--red); }
.touch.run { left: auto; right: calc(14px + env(safe-area-inset-right)); bottom: calc(90px + env(safe-area-inset-bottom)); width: auto; padding: 0 18px; border-radius: 32px; font-size: 14px; }
.touch.held { background: #3549ea; }
#game:not([data-input="touch"]) .touch.l, #game:not([data-input="touch"]) .touch.r, #game:not([data-input="touch"]) .touch.run { display: none; }
#toast { position: absolute; left: 50%; top: 26%; transform: translateX(-50%); padding: 10px 22px 10px 46px; background: var(--paper); color: #1d1b33; font-size: clamp(14px, 2.6vmin, 18px); font-weight: 700; white-space: nowrap; clip-path: polygon(0 12%, 30% 0, 100% 8%, 97% 92%, 62% 100%, 2% 90%); animation: toast 2.4s ease-out forwards; pointer-events: none; z-index: 8; }
#toast::before { content: ''; position: absolute; left: 16px; top: 50%; width: 18px; height: 22px; margin-top: -11px; background: var(--c, #ffc37a); clip-path: polygon(0 8%, 60% 0, 100% 22%, 92% 100%, 18% 92%); }
#toast.plain { padding-left: 22px; font-weight: 400; } #toast.plain::before { display: none; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 10px) rotate(-2deg); } 12% { opacity: 1; transform: translate(-50%, 0) rotate(-1deg); } 82% { opacity: 1; } 100% { opacity: 0; } }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 7; }
#flash.on { animation: flashit 0.6s ease-out; }
@keyframes flashit { 0% { opacity: 0.55; } 100% { opacity: 0; } }
.voices { position: absolute; left: 50%; top: 16%; transform: translateX(-50%); width: min(600px, 94vw); text-align: center; font-size: clamp(14px, 2.6vmin, 18px); line-height: 2.1; color: #e8e2f2; text-shadow: 0 0 8px #000; pointer-events: none; }
.voices span { display: block; opacity: 0; animation: voice 3.6s ease-in-out forwards; }
@keyframes voice { 18%, 72% { opacity: 1; } 100% { opacity: 0; } }
#guide { position: absolute; right: 16px; top: 44%; padding: 6px 14px; background: var(--black); border-radius: 16px; font-size: 14px; color: #ffe38a; animation: guide 0.9s ease-in-out infinite alternate; pointer-events: none; }
@keyframes guide { to { transform: translateX(8px); } }

/* 上のボタン */
#top { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 9; }
.pill { background: #0a0f6ecc; border: 1px solid #ffffff55; border-radius: 16px; padding: 4px 12px; font-size: 12px; }

/* コラージュ */
#collage { background: #20184a; display: grid; grid-template-columns: auto auto; align-content: center; justify-content: center; align-items: center; gap: clamp(14px, 4vw, 44px); padding: 44px 14px 14px; }
#collage::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(12deg, #ffffff05 0 2px, transparent 2px 9px); }
#backText { position: absolute; inset: 0; display: grid; place-content: end center; padding-bottom: 4vh; font-size: clamp(12px, 2.4vmin, 19px); line-height: 2; color: #ffffff30; text-align: center; white-space: pre-line; pointer-events: none; font-weight: 700; }
#grid { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; width: min(52vmin, 400px); aspect-ratio: 1; padding: 10px; background: #f4efe614; border-radius: 3px; }
.slot { position: relative; border: 1.5px dashed #ffffff40; display: grid; place-items: stretch; }
.slot.center { border-color: #ffe38a; border-style: solid; }
.slot.ok { background: #ffffff18; }
.piece { position: relative; width: 100%; height: 100%; min-height: 0; border: 0; padding: 4px; font-size: clamp(11px, 2vmin, 15px); font-weight: 700; line-height: 1.25; display: grid; place-items: center; text-align: center; color: #1d1b33; transform: rotate(var(--r, 0deg)); clip-path: polygon(2% 6%, 34% 0, 70% 4%, 100% 2%, 97% 40%, 100% 96%, 60% 100%, 28% 96%, 0 100%, 4% 52%); }
.piece.a-day { background: linear-gradient(140deg, #ffd79a, #ffb062); }
.piece.a-night { background: linear-gradient(140deg, #b9c8ff, #7f97f0); }
.piece.a-lamp { background: linear-gradient(140deg, #fbf7ee, #ddd6c6); }
.piece.a-special { background: linear-gradient(140deg, #fff, #ffd2cf); box-shadow: inset 0 0 0 3px var(--red); }
.piece.picked { filter: brightness(1.15) drop-shadow(0 0 0 #fff); outline: 3px solid #fff; outline-offset: -3px; }
#collage .side { position: relative; display: flex; flex-direction: column; gap: 12px; max-width: 330px; }
#collage h2 { margin: 0; font-size: clamp(18px, 3.4vmin, 24px); }
#collage .side p { margin: 0; font-size: 13px; color: #cfd4ff; line-height: 1.8; }
#hand { display: grid; grid-template-columns: repeat(3, clamp(60px, 13vmin, 92px)); grid-auto-rows: clamp(60px, 13vmin, 92px); gap: 8px; min-height: clamp(60px, 13vmin, 92px); }
#give { align-self: flex-start; }
#give:disabled { opacity: 0.35; cursor: default; }
@media (max-aspect-ratio: 1/1) { #collage { grid-template-columns: auto; } #hand { grid-template-columns: repeat(5, 58px); grid-auto-rows: 58px; } }
@media (max-height: 460px) { #collage .side p { display: none; } #hand { grid-template-columns: repeat(5, 54px); grid-auto-rows: 54px; } #collage { padding-top: 40px; } }

/* エンド */
#end { background: #000; display: grid; grid-template-rows: minmax(0, 1fr) auto; }
#end .cg { position: relative; min-height: 0; }
#end .cg svg { position: absolute; inset: 0; width: 100%; height: 100%; }
#end .cg img { position: absolute; }
#end .text { position: relative; padding: 46px 18px calc(18px + env(safe-area-inset-bottom)); text-align: center; background: linear-gradient(transparent, #000 46px); margin-top: -46px; }
#end .no { font-size: 12px; letter-spacing: 0.3em; color: #b8b8c8; }
#end h2 { margin: 2px 0 10px; font-size: clamp(22px, 5vmin, 36px); }
#end .line { min-height: 3.4em; margin: 0 auto; max-width: 640px; font-size: clamp(14px, 2.6vmin, 18px); line-height: 1.7; }
#end .after { display: flex; gap: 8px 26px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
#end .after small { width: 100%; font-size: 11px; color: #8c8ca0; }

/* エンド一覧・紙片一覧 */
#book { position: absolute; inset: 0; z-index: 20; background: #0a0f6ef2; display: grid; place-items: center; padding: 16px; }
#book .inner { width: min(680px, 100%); max-height: 100%; overflow: auto; }
#book h2 { margin: 0 0 12px; font-size: 22px; }
#book ul { margin: 0 0 16px; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }
#book li { padding: 6px 12px; border-radius: 3px; background: #ffffff18; font-size: 14px; }
#book li.got { background: var(--paper); color: #1d1b33; }
#book li.a-day { background: #ffc37a; } #book li.a-night { background: #9db4ff; } #book li.a-special { background: #ffb0ac; }
.tag { position: absolute; right: 8px; bottom: 6px; font-size: 10px; color: #ffffff66; pointer-events: none; z-index: 9; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01s !important; animation-iteration-count: 1 !important; transition-duration: 0s !important; } }
</style>
</head>
<body>
<div id="game" data-screen="title">
  <section id="bench" class="screen sky">
    <div class="stage" id="benchStage"></div>
    <div id="log"></div><div id="choices"></div><p id="tap"></p>
    <div id="titleUI">
      <div>
        <h1><span>YOIYAMI</span>よいやみ</h1>
        <p class="lead">夜、一人でベンチに座る少女のために街を歩く。<br>選んだ紙片で、彼女の「これから」が変わる。</p>
        <nav>
          <button class="menu" id="start">はじめから</button>
          <button class="menu" id="openEnds">エンド一覧</button>
          <button class="menu" id="openPieces">紙片一覧</button>
        </nav>
      </div>
      <small>7班 中間発表版（仮素材）。学校の場面に、学校に行けていない子についての会話が出てきます。</small>
    </div>
  </section>
  <section id="map" class="screen sky" hidden>
    <div id="far"></div>
    <div id="world"></div>
    <div id="hud"><div id="place"></div><button id="bag" aria-label="持っている紙片"><span class="count" id="count"></span><div id="pieces"></div></button></div>
    <ul id="bagList" hidden></ul>
    <p id="hint"></p>
    <div id="ask" hidden></div>
    <div id="guide" hidden>ゴミ箱 ▶</div>
    <button class="touch l" id="tl" aria-label="左へ歩く">◀</button><button class="touch r" id="tr" aria-label="右へ歩く">▶</button>
    <button class="touch run" id="trun" hidden>走る</button><button class="touch act" id="ta" hidden>調べる</button>
  </section>
  <section id="collage" class="screen" hidden>
    <div id="backText"></div>
    <div id="grid"></div>
    <div class="side">
      <h2>少女のコラージュ</h2>
      <p>集めた紙片を並べて、少女に渡します。紙片を選んでから、置きたいマスを押してください。置いた紙片を押すと手元に戻ります。</p>
      <div id="hand"></div>
      <button id="give" class="choice" disabled>少女に渡す</button>
    </div>
  </section>
  <section id="end" class="screen" hidden></section>
  <div id="top"><button class="pill" id="sound" aria-pressed="true">音 オン</button><button class="pill" id="skip" hidden>会話を飛ばす</button><button class="pill" id="toTitle" hidden>タイトルへ</button></div>
  <div id="flash"></div>
  <div id="book" hidden><div class="inner"><h2 id="bookTitle"></h2><ul id="bookList"></ul><button class="choice" id="closeBook">閉じる</button></div></div>
  <span class="tag">よいやみ 中間発表版 · 仮素材</span>
</div>
<script>
'use strict';
// ===================================================================================================
// データ。企画書「よいやみ 企画書・ゲーム詳細設計」（2026-11-09 ときとまる）の 1-7、2-4、2-5 より。
// 属性: day=昼(+1) night=夜(-1) lamp=灯(0) special=特殊(0、中央に置いた時だけ特殊エンド)。
// 属性は画面には文字で出さない（企画書「内部設定」）。紙片の色だけで伝える（暖色=昼、寒色=夜）。
// 企画書に属性が書かれていない「インドア」は夜、「わんぱく」は昼と仮定（昼14・夜12・灯8 の枚数に合う）。
// ===================================================================================================
const EVENTS = {
  residential: [
    { id: 'C01', x: 420, name: '自販機の下で光る小銭', q: '自販機の下で、小銭が光っている。', opts: [['交番に届ける', '誠実', 'day'], ['自分のものにする', 'ちゃっかり', 'night']] },
    { id: 'C02', x: 820, name: '点滅する街灯', q: '街灯が、ちかちか点滅している。', opts: [['軽く叩いてみる', '大胆', 'day'], ['眺める', '夢見がち', 'night']] },

// 絵（全部仮）。SVG を文字列で作る。よいやみだけはデザイナー（さりーさん）の絵。

const C = { far: '#1421a8', mid: '#0f1890', dark: '#0a1066', edge: '#5e72ff', walk: '#2233c8', road: '#0a0f5e', win: '#ffd3e2', win2: '#ffc98a', off: '#1c2bc4', lamp: '#fff3c4', leaf: '#0f4f9a', leaf2: '#1467a8' };
function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function skyline(width, seed, base = 520) {
  const r = rng(seed); let out = '';
  for (let x = -40; x < width; ) {
    const w = 70 + r() * 150, h = 120 + r() * 260;
    out += `<rect x="${x | 0}" y="${base - h | 0}" width="${w | 0}" height="${h | 0}" fill="${C.far}"/>`;
    for (let wy = base - h + 18; wy < base - 20; wy += 30) for (let wx = x + 12; wx < x + w - 16; wx += 24) if (r() < 0.16) out += `<rect x="${wx | 0}" y="${wy | 0}" width="9" height="12" fill="${r() < 0.7 ? C.win : C.win2}" opacity="0.8"/>`;
    x += w + r() * 24;
  }
  return out;
}
function lampPost(x, gy = 520) {
  const t = gy - 270;
  return `<path d="M${x} ${gy}V${t}q0-26 26-26h22" fill="none" stroke="#2a3ad8" stroke-width="7"/><g class="lit"><rect x="${x + 36}" y="${t - 34}" width="46" height="14" rx="7" fill="${C.lamp}"/><path d="M${x + 44} ${t - 20}L${x - 70} ${gy}h260L${x + 74} ${t - 20}z" fill="${C.lamp}" opacity="0.13"/><ellipse cx="${x + 60}" cy="${gy + 2}" rx="130" ry="10" fill="${C.lamp}" opacity="0.18"/></g>`;
}
function houses(width, seed) {
  const r = rng(seed); let out = '';
  for (let x = 20; x < width - 100; ) {
    const w = 190 + r() * 150, h = 200 + r() * 170, y = 520 - h;
    out += `<rect x="${x | 0}" y="${y | 0}" width="${w | 0}" height="${h | 0}" fill="${r() < 0.5 ? C.mid : '#111b9c'}"/><rect x="${x - 6 | 0}" y="${y - 8 | 0}" width="${w + 12 | 0}" height="10" fill="${C.dark}"/>`;
    if (r() < 0.5) out += `<rect x="${x + w * 0.6 | 0}" y="${y - 36 | 0}" width="34" height="28" fill="${C.dark}"/>`;
    for (let wy = y + 28; wy < 440; wy += 62) for (let wx = x + 22; wx < x + w - 46; wx += 64) {
      const lit = r() < 0.3;
      out += `<rect x="${wx | 0}" y="${wy | 0}" width="34" height="34" fill="${lit ? (r() < 0.6 ? C.win : C.win2) : C.off}"/><path d="M${wx + 17 | 0} ${wy | 0}v34" stroke="${C.mid}" stroke-width="2"/>`;
    }
    out += `<rect x="${x + 14 | 0}" y="456" width="${w - 28 | 0}" height="64" fill="${C.dark}" opacity="0.5"/>`;
    x += w + 26 + r() * 50;
  }
  for (let x = 260; x < width; x += 760) out += `<path d="M${x} 520V110M${x - 46} 150h92M${x - 34} 184h68" stroke="${C.dark}" stroke-width="9" fill="none"/><path d="M${x - 46} 150q380 90 760 0M${x - 34} 184q380 70 760 0" stroke="${C.dark}" stroke-width="2" fill="none"/>`;
  return out;
}
function groundStreet(width) {
  let dash = ''; for (let x = 40; x < width; x += 180) dash += `<rect x="${x}" y="630" width="90" height="6" fill="#2a3ad8" opacity="0.7"/>`;
  return `<rect y="518" width="${width}" height="50" fill="${C.walk}"/><rect y="518" width="${width}" height="4" fill="${C.edge}"/><rect y="568" width="${width}" height="152" fill="${C.road}"/><rect y="568" width="${width}" height="5" fill="#141d8a"/>${dash}`;
}
function tree(x, s = 1) { return `<g transform="translate(${x} 520) scale(${s})"><path d="M-9 0V-150h18V0z" fill="${C.dark}"/><circle cx="0" cy="-210" r="92" fill="${C.leaf}"/><circle cx="-62" cy="-160" r="62" fill="${C.leaf}"/><circle cx="66" cy="-166" r="66" fill="${C.leaf}"/><circle cx="-26" cy="-236" r="46" fill="${C.leaf2}" opacity="0.7"/><circle cx="44" cy="-200" r="34" fill="${C.leaf2}" opacity="0.5"/></g>`; }
const BG = {
  residential: (w) => ({ far: skyline(w, 7), near: houses(w, 31) + lampPost(1040) + lampPost(2380) + groundStreet(w) }),
  park: (w) => {
    let t = ''; const r = rng(99);
    for (let x = 120; x < w; x += 330 + r() * 180) t += tree(x, 0.8 + r() * 0.5);
    let fence = `<path d="M0 470H${w}M0 500H${w}" stroke="${C.dark}" stroke-width="5"/>`;
    for (let x = 0; x < w; x += 60) fence += `<path d="M${x} 452V520" stroke="${C.dark}" stroke-width="6"/>`;
    return { far: skyline(w, 53), near: fence + t + lampPost(640) + lampPost(1780) + lampPost(3020) + `<rect y="518" width="${w}" height="202" fill="#0f2f86"/><rect y="518" width="${w}" height="4" fill="#3d8ed0"/><ellipse cx="420" cy="540" rx="170" ry="16" fill="#1a4aa0"/>` };

    for (let x = 90; x < w; x += 520) o += `<rect x="${x}" y="110" width="250" height="190" fill="#18249e"/><path d="M${x} 110h250v190h-250zM${x + 125} 110v190M${x} 205h250" fill="none" stroke="#3b3466" stroke-width="7"/><rect x="${x + 30}" y="230" width="50" height="70" fill="#1421a8"/><rect x="${x + 150}" y="250" width="70" height="50" fill="#1421a8"/>`;
    for (let x = 400; x < w; x += 520) o += `<rect x="${x}" y="170" width="150" height="350" fill="#342d58"/><rect x="${x + 16}" y="190" width="52" height="120" fill="#1b1730"/><rect x="${x + 82}" y="190" width="52" height="120" fill="#1b1730"/><path d="M${x + 75} 170v350" stroke="#211c3a" stroke-width="4"/><rect x="${x + 40}" y="130" width="70" height="26" fill="#3b3466"/>`;
    for (let x = 200; x < w; x += 420) o += `<rect x="${x}" y="40" width="130" height="10" fill="#c9cfb8" opacity="0.5"/><path d="M${x} 50L${x - 80} 520h290L${x + 130} 50z" fill="#c9cfb8" opacity="0.04"/>`;
    o += `<rect y="518" width="${w}" height="202" fill="#17132c"/><rect y="518" width="${w}" height="4" fill="#4a4380"/><rect y="600" width="${w}" height="3" fill="#221d3e"/>`;
    return { far: '', near: o };
  },

const $ = (s) => document.querySelector(s);
const game = $('#game');

const wait = (ms) => new Promise((r) => setTimeout(r, ms));
function store(key, add) {
  let list = []; try { list = JSON.parse(localStorage.getItem(key) || '[]'); } catch { /* 保存できない環境でも遊べる */ }
  if (add && !list.includes(add)) { list.push(add); try { localStorage.setItem(key, JSON.stringify(list)); } catch { /* 同上 */ } }
  return list;
}
function resize() { game.style.setProperty('--s', Math.min(innerHeight / 720, innerWidth / 420).toFixed(4)); }

// 音。効果音はコンポーザー提供（materials/se）。学校のざわめきは素材がないので仮の音を作る。
let soundOn = store('yoiyami-sound-off').length === 0, actx = null, murmur = null;
function se(name, volume = 0.6) { if (!soundOn) return; try { const a = new Audio(SE[name]); a.volume = volume; a.play().catch(() => {}); } catch { /* 音が鳴らなくても遊べる */ } }
function setMurmur(level) {
  if (!soundOn || !window.AudioContext) { if (murmur) murmur.gain.value = 0; return; }
  if (!actx) {
    actx = new AudioContext();
    const buffer = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate), data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const src = actx.createBufferSource(); src.buffer = buffer; src.loop = true;
    const band = actx.createBiquadFilter(); band.type = 'bandpass'; band.frequency.value = 520; band.Q.value = 1.4;
    const wob = actx.createOscillator(); wob.frequency.value = 5.5; const wobGain = actx.createGain(); wobGain.gain.value = 260; wob.connect(wobGain).connect(band.frequency); wob.start();
    murmur = actx.createGain(); murmur.gain.value = 0; src.connect(band).connect(murmur).connect(actx.destination); src.start();
  }
  murmur.gain.setTargetAtTime(level, actx.currentTime, 0.15);
}
function renderSound() { $('#sound').textContent = soundOn ? '音 オン' : '音 オフ'; $('#sound').setAttribute('aria-pressed', String(soundOn)); }

renderSound();

  show('end'); setTop({}); se('move', 0.4);
  const extra = id === 'E02' ? `<img src="${IMG.idle[0]}" alt="" style="left:50%;bottom:6%;height:42%;transform:translateX(10%)">` : id === 'E04' ? `<img src="${IMG.idle[1]}" alt="" style="left:6%;bottom:4%;height:30%;opacity:.85">` : '';
  $('#end').innerHTML = `<div class="cg"><svg viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice">${END_CG[id]}</svg>${extra}</div>
    <div class="text"><div class="no">END ${id.slice(2)}</div><h2>${end.name}</h2><p class="line"></p>
    <div class="after" hidden><button class="menu" id="again">並べ直す</button><button class="menu" id="back">タイトルへ</button><small>見たエンド ${seen.length} / 6　·　確認用：コラージュの点数 ${score > 0 ? '+' : ''}${score}</small></div></div>`;
  game.dataset.end = id;
  let i = 0; const line = $('#end .line');
  const next = () => {
    if (my !== scene) return;
    if (i >= texts.length) { $('#end .after').hidden = false; $('#end').removeEventListener('pointerdown', onTap); return; }
    line.textContent = texts[i++]; line.classList.remove('fade'); void line.offsetWidth; line.classList.add('fade');
  };
  const onTap = (e) => { if (!e.target.closest('button')) next(); };
  $('#end').addEventListener('pointerdown', onTap); endAdvance = next; next();
  $('#again').onclick = () => { endAdvance = null; collage(); };
  $('#back').onclick = () => { endAdvance = null; title(); };
}
let endAdvance = null;

// エンド一覧・紙片一覧（未到達は「？？？」。企画書 2-6）
function openBook(kind) {
  const seen = store(kind === 'ends' ? 'yoiyami-ends' : 'yoiyami-pieces');
  $('#bookTitle').textContent = kind === 'ends' ? `エンド一覧　${seen.length} / 6` : '紙片一覧';
  if (kind === 'ends') $('#bookList').innerHTML = Object.entries(ENDS).map(([id, e]) => `<li class="${seen.includes(id) ? 'got' : ''}">${seen.includes(id) ? e.name : '？？？'}</li>`).join('');
  else {
    const all = [...EXTRA_PIECES, ...Object.values(EVENTS).flat().flatMap((e) => (e.opts || []).map((o) => [o[1], o[2]]))];
    $('#bookTitle').textContent = `紙片一覧　${all.filter(([n]) => seen.includes(n)).length} / ${all.length}`;
    $('#bookList').innerHTML = all.map(([n, a]) => `<li class="${seen.includes(n) ? 'got a-' + a : ''}">${seen.includes(n) ? n : '？？？'}</li>`).join('');
  }
  $('#book').hidden = false;
}
$('#openEnds').onclick = () => openBook('ends'); $('#openPieces').onclick = () => openBook('pieces'); $('#closeBook').onclick = () => { $('#book').hidden = true; };
$('#start').onclick = () => { se('select'); intro(); };
$('#skip').onclick = () => { tutorial(); };
$('#toTitle').onclick = () => { busy = false; $('#ask').hidden = true; $('#trun').hidden = true; tutorialMode = false; title(); };

// ===================================================================================================
// 入力
// ===================================================================================================
function setInput(touch) { game.dataset.input = touch ? 'touch' : 'keys'; }
setInput(matchMedia('(pointer: coarse)').matches);
addEventListener('pointerdown', (e) => { if (e.pointerType === 'touch') setInput(true); }, true);
addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') { keys.add('l'); setInput(false); }
  if (e.code === 'ArrowRight' || e.code === 'KeyD') { keys.add('r'); setInput(false); }
  if (e.key === 'Shift') keys.add('run');
  if (e.code === 'Enter' || e.code === 'Space' || e.code === 'KeyE') {
    if (document.activeElement && document.activeElement.tagName === 'BUTTON' && e.code !== 'KeyE') return;
    if (!$('#bench').hidden && advance) { e.preventDefault(); advance(); }
    else if (!$('#map').hidden && $('#ask').hidden) { e.preventDefault(); act(); }
    else if (!$('#end').hidden && endAdvance) { e.preventDefault(); endAdvance(); }
  }
  if (/^Digit[1-9]$/.test(e.code)) { const n = Number(e.code.slice(5)) - 1; const box = !$('#map').hidden && !$('#ask').hidden ? $('#ask') : !$('#bench').hidden ? choices : null; box?.querySelectorAll('.choice')[n]?.click(); }
});
addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.delete('l');
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.delete('r');
  if (e.key === 'Shift') keys.delete('run');
});
addEventListener('blur', () => keys.clear());
for (const [id, k] of [['#tl', 'l'], ['#tr', 'r'], ['#trun', 'run']]) {
  const b = $(id), up = () => { keys.delete(k); b.classList.remove('held'); };
  b.addEventListener('pointerdown', (e) => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch { /* 外れても pointerup で止まる */ } keys.add(k); b.classList.add('held'); });
  for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) b.addEventListener(t, up);
  b.addEventListener('contextmenu', (e) => e.preventDefault());
}
$('#ta').onclick = act;
title();
</script>
</body>
